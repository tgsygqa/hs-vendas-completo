<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Hardware Store — Vendas</title>
<style>
  :root { --bg:#0f1115; --panel:#181b21; --panel-2:#22262d; --border:#2d333b; --text:#e8eaed; --muted:#8b93a1; --accent:#3b82f6; --accent-dim:rgba(59,130,246,.12); --ok:#10b981; --err:#ef4444; --warn:#f59e0b; --radius:10px; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; }

  header.topbar { background:var(--panel); border-bottom:1px solid var(--border); padding:16px 40px; display:flex; align-items:center; justify-content:space-between; }
  header.topbar .brand { font-size:19px; font-weight:700; display:flex; align-items:center; gap:10px; }
  header.topbar .brand .logo { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg, var(--accent), #8b5cf6); display:flex; align-items:center; justify-content:center; font-size:16px; }
  header.topbar .brand span { color:var(--accent); }
  header.topbar .cart-pill { display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border); padding:8px 16px; border-radius:20px; font-size:13px; color:var(--muted); }
  header.topbar .cart-pill b { color:var(--text); }

  .stepper { display:flex; align-items:center; justify-content:center; gap:0; padding:24px 20px 8px; max-width:640px; margin:0 auto; }
  .stepper .step { display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; position:relative; }
  .stepper .step .circle { width:30px; height:30px; border-radius:50%; background:var(--panel-2); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--muted); transition:.2s; }
  .stepper .step .label { font-size:12px; color:var(--muted); font-weight:500; }
  .stepper .step.done .circle { background:var(--ok); border-color:var(--ok); color:#06261b; }
  .stepper .step.active .circle { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stepper .step.active .label, .stepper .step.done .label { color:var(--text); }
  .stepper .line { flex:1; height:2px; background:var(--border); margin:0 -4px 22px; }
  .stepper .line.done { background:var(--ok); }

  main { max-width:1140px; margin:0 auto; padding:24px 32px 60px; }
  .row { display:flex; gap:20px; align-items:flex-start; }
  .col { flex:1; min-width:0; }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:18px; }
  .card h2 { font-size:16px; font-weight:600; margin:0 0 16px; display:flex; align-items:center; gap:8px; }
  .card h2 .num { width:22px; height:22px; border-radius:50%; background:var(--accent-dim); color:var(--accent); font-size:12px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; }
  h3.sublabel { font-size:11.5px; margin:18px 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }

  label { display:block; font-size:12px; font-weight:500; color:var(--muted); margin:10px 0 5px; }
  input, select { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:10px 12px; color:var(--text); font-size:14px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  input[type=checkbox], input[type=radio] { width:auto; accent-color:var(--accent); }

  button.action { background:var(--accent); color:#fff; border:none; padding:12px 20px; border-radius:8px; font-weight:600; cursor:pointer; font-size:14.5px; transition:.15s; }
  button.action:hover:not(:disabled) { background:#2f6fe0; }
  button.action:disabled { opacity:.35; cursor:not-allowed; }
  button.secondary { background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:7px; cursor:pointer; font-size:13.5px; font-weight:500; }
  button.secondary:hover { border-color:var(--accent); color:var(--accent); }
  button.link { background:none; border:none; color:var(--accent); font-size:13px; cursor:pointer; padding:0; font-weight:500; }

  .produtos-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:14px; }
  .produto-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; transition:.15s; }
  .produto-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .produto-thumb { width:100%; aspect-ratio:1.3; border-radius:8px; background:linear-gradient(135deg, var(--panel-2), var(--bg)); display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom:12px; border:1px solid var(--border); }
  .produto-card .categoria { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
  .produto-card .nome { font-size:13.5px; font-weight:600; line-height:1.35; margin-bottom:8px; flex:1; }
  .produto-card .preco { font-size:17px; font-weight:700; color:var(--ok); margin-bottom:2px; }
  .produto-card .estoque { font-size:11.5px; color:var(--muted); margin-bottom:10px; }
  .produto-card .estoque.baixo { color:var(--warn); }
  .qty-stepper { display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:7px; overflow:hidden; margin-bottom:8px; }
  .qty-stepper button { flex:0 0 30px; height:30px; background:var(--panel-2); border:none; color:var(--text); cursor:pointer; font-size:15px; }
  .qty-stepper input { border:none; border-left:1px solid var(--border); border-right:1px solid var(--border); border-radius:0; text-align:center; height:30px; padding:0; font-size:13px; }
  .produto-card button.action { width:100%; padding:9px; font-size:13px; }

  .carrinho-item { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--panel-2); }
  .carrinho-item:last-child { border-bottom:none; }
  .carrinho-item .thumb-mini { width:40px; height:40px; border-radius:6px; background:var(--panel-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .carrinho-item .info { flex:1; min-width:0; }
  .carrinho-item .info .nome { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .carrinho-item .info .preco-un { font-size:11.5px; color:var(--muted); }
  .carrinho-item .qty { display:flex; align-items:center; gap:6px; }
  .carrinho-item .qty button { width:22px; height:22px; border-radius:5px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); cursor:pointer; font-size:12px; line-height:1; }
  .carrinho-item .remover { color:var(--err); background:none; border:none; cursor:pointer; font-size:11.5px; margin-left:6px; }

  .total-line { display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px; color:var(--muted); }
  .total-line .v { color:var(--text); }
  .total-line.grand { font-size:18px; font-weight:700; border-top:1px solid var(--border); margin-top:8px; padding-top:14px; color:var(--text); }
  .total-line.grand .v { color:var(--ok); }
  .total-line.falta .v { color:var(--warn); font-weight:600; }
  .total-line.falta.coberto .v { color:var(--ok); }

  .select-card { display:block; border:1.5px solid var(--border); border-radius:9px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:.12s; position:relative; }
  .select-card:hover { border-color:#45506099; }
  .select-card.selected { border-color:var(--accent); background:var(--accent-dim); }
  .select-card input { position:absolute; top:14px; right:14px; }
  .select-card .titulo { font-size:14px; font-weight:600; margin-bottom:3px; padding-right:24px; }
  .select-card .detalhe { font-size:12.5px; color:var(--muted); }
  .select-card.cupom .valor { float:right; color:var(--ok); font-weight:700; font-size:14px; }

  .badge { font-size:10.5px; padding:3px 8px; border-radius:5px; font-weight:700; letter-spacing:.02em; }
  .badge.PROMOCIONAL { background:rgba(59,130,246,.15); color:var(--accent); }
  .badge.TROCA { background:rgba(245,158,11,.15); color:var(--warn); }
  .badge.auto { background:rgba(16,185,129,.15); color:var(--ok); font-size:10px; margin-left:8px; }

  #msg-erro { background:rgba(239,68,68,.1); border:1px solid var(--err); color:#fca5a5; padding:13px 16px; border-radius:9px; margin-bottom:18px; display:none; font-size:13.5px; }
  .empty { color:var(--muted); font-size:13px; padding:20px 0; text-align:center; }

  .confirmacao { text-align:center; padding:56px 20px; }
  .confirmacao .check { width:68px; height:68px; border-radius:50%; background:rgba(16,185,129,.15); color:var(--ok); display:flex; align-items:center; justify-content:center; font-size:34px; margin:0 auto 20px; border:2px solid var(--ok); }
  .confirmacao h2 { font-size:22px; margin-bottom:6px; }
  .confirmacao .pedido-num { color:var(--muted); font-size:14px; margin-bottom:18px; }
  .confirmacao .status-pill { display:inline-block; background:rgba(245,158,11,.15); color:var(--warn); padding:6px 16px; border-radius:20px; font-weight:700; font-size:13px; letter-spacing:.03em; margin-bottom:18px; }
  .confirmacao .valor-final { font-size:28px; font-weight:700; color:var(--ok); margin-bottom:28px; }
  .resumo-pedido { max-width:420px; margin:0 auto 24px; text-align:left; background:var(--panel-2); border-radius:9px; padding:16px 18px; }
  .resumo-pedido .li { display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--muted); }
  .resumo-pedido .li span:last-child { color:var(--text); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">🛒</span>Hardware<span>Store</span></div>
  <div class="cart-pill" data-cy="cart-pill">🛍️ <b data-cy="cart-pill-count">0</b> item(ns) · <b data-cy="cart-pill-total">R$ 0,00</b></div>
</header>

<div class="stepper" id="stepper"></div>

<main>
  <div id="msg-erro" data-cy="msg-erro"></div>
  <div id="view-container"></div>
</main>

<script>
const CLIENTE_ID = 1;
const FRETE = 24.90;

const API_BASE = (() => {
  const { hostname, protocol, port } = window.location;
  if (hostname.endsWith('.github.dev')) {
    const p = port || '5500';
    const novoHost = hostname.replace(`-${p}.`, '-8080.');
    return `${protocol}//${novoHost}/api`;
  }
  return 'http://localhost:8080/api';
})();

const ICONES_CATEGORIA = {
  'Placas de Vídeo': '🎮', 'Processadores': '🧠', 'Periféricos': '⌨️',
  'Armazenamento': '💾', 'default': '📦',
};
function iconeProduto(categoria) { return ICONES_CATEGORIA[categoria] || ICONES_CATEGORIA.default; }

const state = {
  view: 'carrinho',
  produtos: [],
  carrinho: { itens: [], total: 0 },
  cliente: { enderecos: [], cartoes: [] },
  cupons: [],
  mostrarNovoEndereco: false,
  mostrarNovoCartao: false,
  enderecoSelecionado: null,
  cartoesSelecionados: new Set(),
  cupomSelecionado: null,
  pedidoFinalizado: null,
};

function fmt(v) {
  return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function esc(t) {
  return String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function api(path, options = {}) {
  const resp = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
  });
  const texto = await resp.text();
  const corpo = texto ? JSON.parse(texto) : null;
  if (!resp.ok) {
    const msg = (corpo && (corpo.mensagem || corpo.message)) || `Erro ${resp.status}`;
    throw new Error(msg);
  }
  return corpo;
}

function mostrarErro(msg) {
  const el = document.getElementById('msg-erro');
  el.textContent = msg;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function esconderErro() {
  document.getElementById('msg-erro').style.display = 'none';
}

async function carregarTudo() {
  const [produtos, carrinho, cliente, cupons] = await Promise.all([
    api('/produtos'),
    api(`/clientes/${CLIENTE_ID}/carrinho`),
    api(`/clientes/${CLIENTE_ID}`),
    api(`/clientes/${CLIENTE_ID}/cupons`),
  ]);
  state.produtos = produtos;
  state.carrinho = carrinho;
  state.cliente = cliente;
  state.cupons = cupons;
}

function renderStepper() {
  const etapas = [
    { id: 'carrinho', label: 'Carrinho' },
    { id: 'checkout', label: 'Entrega e Pagamento' },
    { id: 'confirmacao', label: 'Confirmação' },
  ];
  const idx = etapas.findIndex(e => e.id === state.view);
  document.getElementById('stepper').innerHTML = etapas.map((e, i) => {
    const cls = i < idx ? 'done' : i === idx ? 'active' : '';
    const circleContent = i < idx ? '✓' : (i + 1);
    const linha = i > 0 ? `<div class="line ${i <= idx ? 'done' : ''}"></div>` : '';
    return `${linha}<div class="step ${cls}" data-cy="step-${e.id}"><div class="circle">${circleContent}</div><div class="label">${e.label}</div></div>`;
  }).join('');

  const count = (state.carrinho.itens || []).reduce((s, i) => s + i.quantidade, 0);
  document.querySelector('[data-cy=cart-pill-count]').textContent = count;
  document.querySelector('[data-cy=cart-pill-total]').textContent = fmt(state.carrinho.total);
}

async function render() {
  renderStepper();
  const container = document.getElementById('view-container');
  if (state.view === 'carrinho') container.innerHTML = viewCarrinho();
  else if (state.view === 'checkout') container.innerHTML = viewCheckout();
  else container.innerHTML = viewConfirmacao();
}

function viewCarrinho() {
  const itensCarrinho = state.carrinho.itens || [];
  return `
    <div class="row">
      <div class="col" style="flex:1.6">
        <div class="card">
          <h2><span class="num">1</span>Produtos disponíveis</h2>
          <div class="produtos-grid">
            ${state.produtos.map(p => `
              <div class="produto-card" data-cy="produto-row" data-id="${p.id}">
                <div class="produto-thumb">${iconeProduto(p.categoria)}</div>
                <div class="categoria">${esc(p.categoria)}</div>
                <div class="nome">${esc(p.nome)}</div>
                <div class="preco">${fmt(p.precoVenda)}</div>
                <div class="estoque ${p.quantidadeDisponivel <= 5 ? 'baixo' : ''}" data-cy="produto-estoque">
                  ${p.quantidadeDisponivel > 0 ? `${p.quantidadeDisponivel} em estoque` : 'Indisponível'}
                </div>
                <div class="qty-stepper">
                  <button onclick="ajustarInputQtd(${p.id}, -1)">−</button>
                  <input type="number" min="1" value="1" data-cy="input-qtd-produto" id="qtd-${p.id}">
                  <button onclick="ajustarInputQtd(${p.id}, 1)">+</button>
                </div>
                <button class="action" data-cy="btn-adicionar-carrinho" ${p.quantidadeDisponivel <= 0 ? 'disabled' : ''}
                  onclick="adicionarAoCarrinho(${p.id})">Adicionar</button>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
      <div class="col" style="flex:1; position:sticky; top:84px;">
        <div class="card">
          <h2>🛒 Seu Carrinho</h2>
          ${itensCarrinho.length === 0 ? '<div class="empty" data-cy="carrinho-vazio">Seu carrinho está vazio.<br>Adicione produtos ao lado.</div>' : `
            <div>
              ${itensCarrinho.map(i => `
                <div class="carrinho-item" data-cy="carrinho-item" data-id="${i.id}">
                  <div class="thumb-mini">${iconeProduto('')}</div>
                  <div class="info">
                    <div class="nome">${esc(i.produtoNome)}</div>
                    <div class="preco-un">${fmt(i.precoUnitario)} cada</div>
                  </div>
                  <div class="qty">
                    <button data-cy="btn-diminuir-qtd" onclick="alterarQtd(${i.id}, ${i.quantidade - 1})">−</button>
                    <span data-cy="qtd-item">${i.quantidade}</span>
                    <button data-cy="btn-aumentar-qtd" onclick="alterarQtd(${i.id}, ${i.quantidade + 1})">+</button>
                  </div>
                  <button class="remover" data-cy="btn-remover-item" onclick="removerItem(${i.id})">remover</button>
                </div>
              `).join('')}
            </div>
            <div class="total-line grand"><span>Total</span><span class="v" data-cy="carrinho-total">${fmt(state.carrinho.total)}</span></div>
          `}
          <button class="action" style="width:100%; margin-top:14px;" data-cy="btn-iniciar-compra"
            ${itensCarrinho.length === 0 ? 'disabled' : ''} onclick="irParaCheckout()">
            Iniciar Compra →
          </button>
        </div>
      </div>
    </div>
  `;
}

function ajustarInputQtd(produtoId, delta) {
  const input = document.getElementById(`qtd-${produtoId}`);
  input.value = Math.max(1, (Number(input.value) || 1) + delta);
}

async function adicionarAoCarrinho(produtoId) {
  esconderErro();
  const qtd = Number(document.getElementById(`qtd-${produtoId}`).value) || 1;
  try {
    state.carrinho = await api(`/clientes/${CLIENTE_ID}/carrinho/itens`, {
      method: 'POST',
      body: JSON.stringify({ produtoId, quantidade: qtd }),
    });
    await render();
  } catch (e) { mostrarErro(e.message); }
}

async function alterarQtd(itemId, novaQtd) {
  esconderErro();
  if (novaQtd <= 0) return removerItem(itemId);
  try {
    state.carrinho = await api(`/clientes/${CLIENTE_ID}/carrinho/itens/${itemId}`, {
      method: 'PATCH',
      body: JSON.stringify({ quantidade: novaQtd }),
    });
    await render();
  } catch (e) { mostrarErro(e.message); }
}

async function removerItem(itemId) {
  esconderErro();
  try {
    state.carrinho = await api(`/clientes/${CLIENTE_ID}/carrinho/itens/${itemId}`, { method: 'DELETE' });
    await render();
  } catch (e) { mostrarErro(e.message); }
}

function irParaCheckout() {
  esconderErro();
  state.view = 'checkout';
  render();
}

function valorProdutos() { return state.carrinho.total; }
function valorTotalCompra() { return valorProdutos() + FRETE; }

function valorCupomSelecionado() {
  if (!state.cupomSelecionado) return 0;
  const c = state.cupons.find(c => c.id === state.cupomSelecionado);
  return c ? Number(c.valor) : 0;
}

function calcularValoresPorCartao() {
  const restante = Math.max(0, valorTotalCompra() - valorCupomSelecionado());
  const ids = [...state.cartoesSelecionados];
  if (ids.length === 0 || restante === 0) return {};
  const parte = Math.floor((restante / ids.length) * 100) / 100;
  const valores = {};
  let somaParcial = 0;
  ids.forEach((id, i) => {
    if (i === ids.length - 1) {
      valores[id] = Math.round((restante - somaParcial) * 100) / 100;
    } else {
      valores[id] = parte;
      somaParcial += parte;
    }
  });
  return valores;
}

function somaCartoesSelecionados() {
  return Object.values(calcularValoresPorCartao()).reduce((s, v) => s + v, 0);
}

function viewCheckout() {
  const enderecos = state.cliente.enderecos || [];
  const cartoes = state.cliente.cartoes || [];
  const valoresPorCartao = calcularValoresPorCartao();
  const pago = somaCartoesSelecionados() + valorCupomSelecionado();
  const falta = Math.max(0, valorTotalCompra() - pago);
  const coberto = falta === 0 && (state.cartoesSelecionados.size > 0 || state.cupomSelecionado);

  return `
    <div class="row">
      <div class="col" style="flex:1.4">
        <div class="card">
          <h2><span class="num">2</span>Endereço de Entrega</h2>
          ${enderecos.map(e => `
            <label class="select-card ${state.enderecoSelecionado === e.id ? 'selected' : ''}" data-cy="radio-endereco-card">
              <input type="radio" name="endereco" value="${e.id}" data-cy="radio-endereco"
                ${state.enderecoSelecionado === e.id ? 'checked' : ''}
                onchange="state.enderecoSelecionado=${e.id}; render();">
              <div class="titulo">${esc(e.apelido)}</div>
              <div class="detalhe">${esc(e.tipoLogradouro)} ${esc(e.logradouro)}, ${esc(e.numero)} — ${esc(e.bairro)}, ${esc(e.cidade)}/${esc(e.estado)}</div>
            </label>
          `).join('') || '<div class="empty">Nenhum endereço cadastrado.</div>'}

          ${state.mostrarNovoEndereco ? formNovoEndereco() : `
            <button class="secondary" data-cy="btn-novo-endereco" onclick="state.mostrarNovoEndereco=true; render();">+ Cadastrar novo endereço</button>
          `}
        </div>

        <div class="card">
          <h2><span class="num">3</span>Forma de Pagamento</h2>
          <h3 class="sublabel">Cartões de crédito</h3>
          ${cartoes.map(c => `
            <label class="select-card ${state.cartoesSelecionados.has(c.id) ? 'selected' : ''}" data-cy="pagamento-cartao-row" data-id="${c.id}">
              <input type="checkbox" data-cy="chk-cartao" ${state.cartoesSelecionados.has(c.id) ? 'checked' : ''}
                onchange="toggleCartao(${c.id}, this.checked)">
              <div class="titulo">${esc(c.bandeira)} •••• ${esc(c.ultimosQuatroDigitos)}</div>
              <div class="detalhe">${esc(c.titular)}
                ${state.cartoesSelecionados.has(c.id) ? `<span class="badge auto" data-cy="valor-auto-cartao">cobra ${fmt(valoresPorCartao[c.id] || 0)}</span>` : ''}
              </div>
            </label>
          `).join('') || '<div class="empty">Nenhum cartão cadastrado.</div>'}
          ${state.mostrarNovoCartao ? formNovoCartao() : `
            <button class="secondary" data-cy="btn-novo-cartao" onclick="state.mostrarNovoCartao=true; render();">+ Cadastrar novo cartão</button>
          `}

          <h3 class="sublabel">Cupom de desconto <span style="font-weight:400; text-transform:none; letter-spacing:0;">(escolha no máximo um)</span></h3>
          ${state.cupons.map(c => `
            <label class="select-card cupom ${state.cupomSelecionado === c.id ? 'selected' : ''}" data-cy="cupom-row" data-id="${c.id}">
              <input type="radio" name="cupom" data-cy="radio-cupom" value="${c.id}"
                ${state.cupomSelecionado === c.id ? 'checked' : ''}
                onchange="selecionarCupom(${c.id})">
              <span class="valor">${fmt(c.valor)}</span>
              <div class="titulo">${esc(c.codigo)} <span class="badge ${c.tipo}">${c.tipo}</span></div>
            </label>
          `).join('') || '<div class="empty">Nenhum cupom disponível.</div>'}
          ${state.cupomSelecionado ? `<button class="link" style="margin-top:6px;" onclick="selecionarCupom(null)">Remover cupom</button>` : ''}
        </div>
      </div>

      <div class="col" style="flex:1; position:sticky; top:84px;">
        <div class="card">
          <h2>Resumo da Compra</h2>
          <div class="total-line"><span>Produtos</span><span class="v">${fmt(valorProdutos())}</span></div>
          <div class="total-line"><span>Frete</span><span class="v" data-cy="frete-valor">${fmt(FRETE)}</span></div>
          ${state.cupomSelecionado ? `<div class="total-line"><span>Cupom</span><span class="v" style="color:var(--ok);">− ${fmt(valorCupomSelecionado())}</span></div>` : ''}
          <div class="total-line grand"><span>Total</span><span class="v" data-cy="total-compra">${fmt(valorTotalCompra())}</span></div>
          <div class="total-line falta ${coberto ? 'coberto' : ''}">
            <span>${coberto ? 'Pagamento completo' : 'Ainda falta cobrir'}</span>
            <span class="v" data-cy="valor-restante">${fmt(falta)}</span>
          </div>
          <button class="action" style="width:100%; margin-top:16px;" data-cy="btn-finalizar-compra" onclick="finalizarCompra()">
            Confirmar Pagamento
          </button>
          <button class="secondary" style="width:100%; margin-top:8px;" onclick="state.view='carrinho'; render();">← Voltar ao carrinho</button>
        </div>
      </div>
    </div>
  `;
}

function formNovoEndereco() {
  return `
    <div class="card" style="background:var(--panel-2); margin-top:12px; padding:16px;">
      <h3 class="sublabel">Novo Endereço</h3>
      <label>Apelido *</label><input id="ne-apelido" data-cy="i-ne-apelido">
      <label>Tipo de residência *</label><input id="ne-tipores" data-cy="i-ne-tipores" placeholder="Casa">
      <label>Tipo de logradouro *</label><input id="ne-tipolog" data-cy="i-ne-tipolog" placeholder="Rua">
      <label>Logradouro *</label><input id="ne-logradouro" data-cy="i-ne-logradouro">
      <label>Número *</label><input id="ne-numero" data-cy="i-ne-numero">
      <label>Bairro *</label><input id="ne-bairro" data-cy="i-ne-bairro">
      <label>CEP *</label><input id="ne-cep" data-cy="i-ne-cep">
      <label>Cidade *</label><input id="ne-cidade" data-cy="i-ne-cidade">
      <label>Estado *</label><input id="ne-estado" data-cy="i-ne-estado">
      <label>País *</label><input id="ne-pais" data-cy="i-ne-pais" value="Brasil">
      <label style="display:flex; align-items:center; gap:6px; margin-top:12px;">
        <input type="checkbox" id="ne-cobranca" checked> Usar como cobrança
      </label>
      <label style="display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="ne-entrega" checked> Usar como entrega
      </label>
      <button class="action" style="margin-top:14px;" data-cy="btn-salvar-endereco" onclick="salvarNovoEndereco()">Salvar Endereço</button>
      <button class="secondary" style="margin-top:14px;" onclick="state.mostrarNovoEndereco=false; render();">Cancelar</button>
    </div>
  `;
}

function formNovoCartao() {
  return `
    <div class="card" style="background:var(--panel-2); margin-top:12px; padding:16px;">
      <h3 class="sublabel">Novo Cartão</h3>
      <label>Número *</label><input id="nc-numero" data-cy="i-nc-numero" placeholder="Somente dígitos">
      <label>Bandeira *</label>
      <select id="nc-bandeira" data-cy="i-nc-bandeira">
        <option value="VISA">VISA</option><option value="MASTERCARD">MASTERCARD</option>
        <option value="ELO">ELO</option><option value="AMEX">AMEX</option>
      </select>
      <label>Nome impresso *</label><input id="nc-titular" data-cy="i-nc-titular">
      <label>Código de segurança *</label><input id="nc-cvv" data-cy="i-nc-cvv" maxlength="4">
      <button class="action" style="margin-top:14px;" data-cy="btn-salvar-cartao" onclick="salvarNovoCartao()">Salvar Cartão</button>
      <button class="secondary" style="margin-top:14px;" onclick="state.mostrarNovoCartao=false; render();">Cancelar</button>
    </div>
  `;
}

function toggleCartao(cartaoId, marcado) {
  if (marcado) state.cartoesSelecionados.add(cartaoId);
  else state.cartoesSelecionados.delete(cartaoId);
  render();
}

function selecionarCupom(cupomId) {
  state.cupomSelecionado = cupomId;
  render();
}

async function salvarNovoEndereco() {
  esconderErro();
  const g = id => document.getElementById(id).value;
  try {
    const novo = await api(`/clientes/${CLIENTE_ID}/enderecos`, {
      method: 'POST',
      body: JSON.stringify({
        apelido: g('ne-apelido'), tipoResidencia: g('ne-tipores'), tipoLogradouro: g('ne-tipolog'),
        logradouro: g('ne-logradouro'), numero: g('ne-numero'), bairro: g('ne-bairro'), cep: g('ne-cep'),
        cidade: g('ne-cidade'), estado: g('ne-estado'), pais: g('ne-pais'),
        cobranca: document.getElementById('ne-cobranca').checked,
        entrega: document.getElementById('ne-entrega').checked,
      }),
    });
    state.cliente = await api(`/clientes/${CLIENTE_ID}`);
    state.enderecoSelecionado = novo.id;
    state.mostrarNovoEndereco = false;
    await render();
  } catch (e) { mostrarErro(e.message); }
}

async function salvarNovoCartao() {
  esconderErro();
  const g = id => document.getElementById(id).value;
  try {
    const novo = await api(`/clientes/${CLIENTE_ID}/cartoes`, {
      method: 'POST',
      body: JSON.stringify({
        numero: g('nc-numero'), bandeira: g('nc-bandeira'), titular: g('nc-titular'), cvv: g('nc-cvv'),
      }),
    });
    state.cliente = await api(`/clientes/${CLIENTE_ID}`);
    state.cartoesSelecionados.add(novo.id);
    state.mostrarNovoCartao = false;
    await render();
  } catch (e) { mostrarErro(e.message); }
}

async function finalizarCompra() {
  esconderErro();
  if (!state.enderecoSelecionado) return mostrarErro('Selecione um endereço de entrega.');

  const valoresPorCartao = calcularValoresPorCartao();
  const cartoes = Object.entries(valoresPorCartao).map(([cartaoId, valor]) => ({ cartaoId: Number(cartaoId), valor }));
  const cupomIds = state.cupomSelecionado ? [state.cupomSelecionado] : [];

  try {
    const pedido = await api(`/clientes/${CLIENTE_ID}/pedidos`, {
      method: 'POST',
      body: JSON.stringify({ enderecoId: state.enderecoSelecionado, cartoes, cupomIds }),
    });
    state.pedidoFinalizado = pedido;
    state.view = 'confirmacao';
    state.cartoesSelecionados = new Set();
    state.cupomSelecionado = null;
    state.enderecoSelecionado = null;
    await render();
  } catch (e) { mostrarErro(e.message); }
}

function viewConfirmacao() {
  const p = state.pedidoFinalizado;
  return `
    <div class="card confirmacao">
      <div class="check">✓</div>
      <h2>Pedido realizado com sucesso!</h2>
      <div class="pedido-num">Pedido <strong data-cy="pedido-id">#${p.id}</strong></div>
      <div class="status-pill" data-cy="pedido-status">${p.status}</div>
      <div class="valor-final" data-cy="pedido-total">${fmt(p.valorTotal)}</div>
      <div class="resumo-pedido">
        ${(p.itens || []).map(i => `<div class="li"><span>${i.quantidade}× ${esc(i.produtoNome)}</span><span>${fmt(i.subtotal)}</span></div>`).join('')}
        <div class="li"><span>Frete</span><span>${fmt(p.frete)}</span></div>
        <div class="li"><span>Entrega</span><span>${esc(p.enderecoResumo || '')}</span></div>
      </div>
      <button class="action" data-cy="btn-nova-compra" onclick="reiniciar()">Fazer nova compra</button>
    </div>
  `;
}

async function reiniciar() {
  state.view = 'carrinho';
  state.pedidoFinalizado = null;
  await carregarTudo();
  await render();
}

(async function start() {
  try {
    await carregarTudo();
    await render();
  } catch (e) {
    mostrarErro('Não foi possível carregar os dados da API (' + API_BASE + '). ' + e.message);
  }
})();
</script>
</body>
</html>
