<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Hardware Store — Vendas</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">🛒</span>Hardware<span>Store</span></div>
  <div id="nav-container"></div>
  <div class="cart-pill" data-cy="cart-pill">🛍️ <b data-cy="cart-pill-count">0</b> item(ns) · <b data-cy="cart-pill-total">R$ 0,00</b></div>
</header>

<div class="stepper" id="stepper"></div>

<main>
  <div id="msg-erro" data-cy="msg-erro"></div>
  <div id="view-container"></div>
</main>

<script src="shared.js"></script>
<script>
// ---------------------------------------------------------------------
// Loja (CDU02): carrinho -> entrega e pagamento -> confirmacao.
// CLIENTE_ID, API_BASE, api(), fmt(), esc() e mostrarErro() vem de shared.js.
// O cliente vem da URL (?clienteId=); sem parametro, e o Joao Silva (id 1).
// ---------------------------------------------------------------------
const FRETE = 24.90;

const ICONES_CATEGORIA = {
  'Placas de Vídeo': '🎮', 'Placas de Video': '🎮', 'Processadores': '🧠', 'Periféricos': '⌨️', 'Perifericos': '⌨️',
  'Armazenamento': '💾', 'default': '📦',
};
function iconeProduto(categoria) { return ICONES_CATEGORIA[categoria] || ICONES_CATEGORIA.default; }

const state = {
  view: 'carrinho',
  produtos: [],
  carrinho: { itens: [], total: 0, itensExpirados: [], podeComprar: false },
  cliente: { enderecos: [], cartoes: [] },
  cupons: [],
  mostrarNovoEndereco: false,
  mostrarNovoCartao: false,
  enderecoSelecionado: null,
  cartoesSelecionados: new Set(),   // ids dos cartoes marcados; valor e automatico
  cupomSelecionado: null,            // um unico id, ou null
  pedidoFinalizado: null,
};

// ---------------------------------------------------------------------
// RN0044 - contador do bloqueio do carrinho. O servidor manda quantos
// segundos faltam (segundosParaExpirar); o relogio local so conta a partir
// dai, para nao depender do relogio do computador do cliente estar certo.
// ---------------------------------------------------------------------
let prazoFinalMs = null;
let expirandoAgora = false;

function setCarrinho(c) {
  state.carrinho = c;
  prazoFinalMs = c.segundosParaExpirar != null ? Date.now() + c.segundosParaExpirar * 1000 : null;
  expirandoAgora = false;
}

function fmtTempo(segundos) {
  const m = Math.floor(segundos / 60), s = segundos % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function segundosRestantes() {
  return prazoFinalMs == null ? null : Math.max(0, Math.round((prazoFinalMs - Date.now()) / 1000));
}

async function tick() {
  const restante = segundosRestantes();
  if (restante == null) return;
  const contador = document.querySelector('[data-cy=bloqueio-contador]');
  if (contador) contador.textContent = fmtTempo(restante);
  // RN0044 - o cliente e avisado quando faltam 5 minutos (parametro do servidor) ou menos.
  const aviso = document.querySelector('[data-cy=aviso-expiracao]');
  if (aviso) aviso.style.display = restante <= (state.carrinho.avisoMinutos || 5) * 60 ? 'flex' : 'none';
  const tempoAviso = document.querySelector('[data-cy=aviso-expiracao-tempo]');
  if (tempoAviso) tempoAviso.textContent = fmtTempo(restante);
  // Prazo vencido: pede ao servidor o carrinho atualizado (os itens ja saem
  // do carrinho - RN0045 - e passam a aparecer como expirados - RNF0042).
  if (restante === 0 && !expirandoAgora && state.view !== 'confirmacao') {
    expirandoAgora = true;
    try {
      const anterior = state.view;
      setCarrinho(await api(`/clientes/${CLIENTE_ID}/carrinho`));
      if (anterior === 'checkout' && !state.carrinho.podeComprar) {
        state.view = 'carrinho';
        mostrarErro('O prazo de bloqueio dos itens expirou e eles foram retirados do carrinho. Adicione-os novamente para comprar (RNF0042).');
      }
      await render();
    } catch (e) { mostrarErro(e.message); }
  }
}
setInterval(tick, 1000);

async function carregarTudo() {
  const [produtos, carrinho, cliente, cupons] = await Promise.all([
    api(`/produtos?clienteId=${CLIENTE_ID}`),
    api(`/clientes/${CLIENTE_ID}/carrinho`),
    api(`/clientes/${CLIENTE_ID}`),
    api(`/clientes/${CLIENTE_ID}/cupons`),
  ]);
  state.produtos = produtos;
  setCarrinho(carrinho);
  state.cliente = cliente;
  state.cupons = cupons;
}

// Atualiza so o catalogo e o carrinho (a disponibilidade muda a cada compra/bloqueio).
async function recarregarCatalogo() {
  state.produtos = await api(`/produtos?clienteId=${CLIENTE_ID}`);
}

// ========================================================================
// STEPPER / CABEÇALHO
// ========================================================================
function renderStepper() {
  document.getElementById('nav-container').innerHTML = renderNav('loja');
  const etapas = [
    { id: 'carrinho', label: 'Carrinho' },
    { id: 'checkout', label: 'Entrega e Pagamento' },
    { id: 'confirmacao', label: 'Confirmação' },
  ];
  const idx = etapas.findIndex(e => e.id === state.view);
  document.getElementById('stepper').innerHTML = etapas.map((e, i) => {
    const cls = i < idx ? 'done' : i === idx ? 'active' : '';
    const circleContent = i < idx ? '✓' : (i + 1);
    const linha = i > 0 ? `<div class="line ${i <= idx ? 'done' : ''}"></div>` : '';
    return `${linha}<div class="step ${cls}" data-cy="step-${e.id}"><div class="circle">${circleContent}</div><div class="label">${e.label}</div></div>`;
  }).join('');

  const count = (state.carrinho.itens || []).reduce((s, i) => s + i.quantidade, 0);
  document.querySelector('[data-cy=cart-pill-count]').textContent = count;
  document.querySelector('[data-cy=cart-pill-total]').textContent = fmt(state.carrinho.total);
}

async function render() {
  renderStepper();
  const container = document.getElementById('view-container');
  if (state.view === 'carrinho') container.innerHTML = viewCarrinho();
  else if (state.view === 'checkout') container.innerHTML = viewCheckout();
  else container.innerHTML = viewConfirmacao();
  tick();
}

// ========================================================================
// VIEW: CARRINHO (RF0031, RF0032, RN0031, RN0044, RN0045, RNF0042)
// ========================================================================
function textoEstoque(p) {
  const reservado = (p.quantidadeEstoque ?? p.quantidadeDisponivel) - p.quantidadeDisponivel;
  if (p.quantidadeDisponivel > 0) {
    return `${p.quantidadeDisponivel} em estoque` + (reservado > 0 ? ` · ${reservado} reservado(s) em outros carrinhos` : '');
  }
  return reservado > 0 ? 'Indisponível — reservado em outros carrinhos' : 'Indisponível';
}

function viewCarrinho() {
  const itensCarrinho = state.carrinho.itens || [];
  const expirados = state.carrinho.itensExpirados || [];
  const restante = segundosRestantes();
  const avisoMin = state.carrinho.avisoMinutos || 5;
  return `
    <div class="row">
      <div class="col" style="flex:1.6">
        <div class="card">
          <h2><span class="num">1</span>Produtos disponíveis</h2>
          <div class="produtos-grid">
            ${state.produtos.map(p => `
              <div class="produto-card" data-cy="produto-row" data-id="${p.id}">
                <div class="produto-thumb">${iconeProduto(p.categoria)}</div>
                <div class="categoria">${esc(p.categoria)}</div>
                <div class="nome">${esc(p.nome)}</div>
                <div class="preco">${fmt(p.precoVenda)}</div>
                <div class="estoque ${p.quantidadeDisponivel <= 5 ? 'baixo' : ''}" data-cy="produto-estoque">${textoEstoque(p)}</div>
                <div class="qty-stepper">
                  <button onclick="ajustarInputQtd(${p.id}, -1)">−</button>
                  <input type="number" min="1" value="1" data-cy="input-qtd-produto" id="qtd-${p.id}">
                  <button onclick="ajustarInputQtd(${p.id}, 1)">+</button>
                </div>
                <button class="action" data-cy="btn-adicionar-carrinho" ${p.quantidadeDisponivel <= 0 ? 'disabled' : ''}
                  onclick="adicionarAoCarrinho(${p.id})">Adicionar</button>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
      <div class="col" style="flex:1; position:sticky; top:84px;">
        <div class="card">
          <h2>🛒 Seu Carrinho</h2>

          ${expirados.length ? `
            <div class="aviso err" data-cy="aviso-itens-expirados">
              <div class="grow">⏱️ <b>Itens retirados do carrinho</b> porque o prazo de bloqueio acabou. Adicione-os novamente para poder comprar.</div>
            </div>
            ${expirados.map(e => `
              <div class="expirado-item" data-cy="item-expirado" data-id="${e.id}">
                <div class="info">
                  <div class="nome" data-cy="item-expirado-nome">${esc(e.produtoNome)}</div>
                  <div class="sub">${e.quantidade} un. · expirou em ${fmtData(e.expiradoEm)}</div>
                </div>
                <button class="secondary sm" data-cy="btn-readicionar-expirado" onclick="readicionarExpirado(${e.id})">Adicionar novamente</button>
                <button class="link" data-cy="btn-dispensar-expirado" onclick="dispensarExpirado(${e.id})">dispensar</button>
              </div>
            `).join('')}
          ` : ''}

          ${itensCarrinho.length ? `
            <div class="aviso warn" data-cy="aviso-expiracao" style="display:${restante != null && restante <= avisoMin * 60 ? 'flex' : 'none'}">
              <div class="grow">⚠️ Seus itens serão liberados para outros clientes em <span class="contador" data-cy="aviso-expiracao-tempo">${restante != null ? fmtTempo(restante) : ''}</span>. Finalize a compra antes disso.</div>
            </div>
            <div class="small muted" style="margin-bottom:6px;">Itens reservados por <span class="contador" data-cy="bloqueio-contador">${restante != null ? fmtTempo(restante) : ''}</span></div>
          ` : ''}

          ${itensCarrinho.length === 0 ? '<div class="empty" data-cy="carrinho-vazio">Seu carrinho está vazio.<br>Adicione produtos ao lado.</div>' : `
            <div>
              ${itensCarrinho.map(i => `
                <div class="carrinho-item" data-cy="carrinho-item" data-id="${i.id}">
                  <div class="thumb-mini">${iconeProduto('')}</div>
                  <div class="info">
                    <div class="nome">${esc(i.produtoNome)}</div>
                    <div class="preco-un">${fmt(i.precoUnitario)} cada</div>
                  </div>
                  <div class="qty">
                    <button data-cy="btn-diminuir-qtd" onclick="alterarQtd(${i.id}, ${i.quantidade - 1})">−</button>
                    <span data-cy="qtd-item">${i.quantidade}</span>
                    <button data-cy="btn-aumentar-qtd" onclick="alterarQtd(${i.id}, ${i.quantidade + 1})">+</button>
                  </div>
                  <button class="remover" data-cy="btn-remover-item" onclick="removerItem(${i.id})">remover</button>
                </div>
              `).join('')}
            </div>
            <div class="total-line grand"><span>Total</span><span class="v" data-cy="carrinho-total">${fmt(state.carrinho.total)}</span></div>
          `}
          <button class="action" style="width:100%; margin-top:14px;" data-cy="btn-iniciar-compra"
            ${state.carrinho.podeComprar ? '' : 'disabled'} onclick="irParaCheckout()">
            Iniciar Compra →
          </button>
        </div>
      </div>
    </div>
  `;
}

function ajustarInputQtd(produtoId, delta) {
  const input = document.getElementById(`qtd-${produtoId}`);
  input.value = Math.max(1, (Number(input.value) || 1) + delta);
}

// Depois de qualquer mudanca no carrinho, a disponibilidade do catalogo muda junto.
async function aposMudarCarrinho() {
  await recarregarCatalogo();
  await render();
}

async function adicionarAoCarrinho(produtoId) {
  esconderErro();
  const qtd = Number(document.getElementById(`qtd-${produtoId}`).value) || 1;
  try {
    setCarrinho(await api(`/clientes/${CLIENTE_ID}/carrinho/itens`, {
      method: 'POST',
      body: JSON.stringify({ produtoId, quantidade: qtd }),
    }));
    await aposMudarCarrinho();
  } catch (e) { mostrarErro(e.message); }
}

async function alterarQtd(itemId, novaQtd) {
  esconderErro();
  if (novaQtd <= 0) return removerItem(itemId);
  try {
    setCarrinho(await api(`/clientes/${CLIENTE_ID}/carrinho/itens/${itemId}`, {
      method: 'PATCH',
      body: JSON.stringify({ quantidade: novaQtd }),
    }));
    await aposMudarCarrinho();
  } catch (e) { mostrarErro(e.message); }
}

async function removerItem(itemId) {
  esconderErro();
  try {
    setCarrinho(await api(`/clientes/${CLIENTE_ID}/carrinho/itens/${itemId}`, { method: 'DELETE' }));
    await aposMudarCarrinho();
  } catch (e) { mostrarErro(e.message); }
}

// RNF0042 - "os itens deverao ser adicionados novamente no carrinho".
async function readicionarExpirado(expiradoId) {
  esconderErro();
  try {
    setCarrinho(await api(`/clientes/${CLIENTE_ID}/carrinho/expirados/${expiradoId}/readicionar`, { method: 'POST' }));
    await aposMudarCarrinho();
  } catch (e) { mostrarErro(e.message); }
}

async function dispensarExpirado(expiradoId) {
  esconderErro();
  try {
    setCarrinho(await api(`/clientes/${CLIENTE_ID}/carrinho/expirados/${expiradoId}`, { method: 'DELETE' }));
    await aposMudarCarrinho();
  } catch (e) { mostrarErro(e.message); }
}

function irParaCheckout() {
  esconderErro();
  state.view = 'checkout';
  render();
}

// ========================================================================
// VIEW: CHECKOUT (RF0033-RF0038, RN0023-RN0025, RN0033-RN0036)
// ========================================================================
function valorProdutos() { return state.carrinho.total; }
function valorTotalCompra() { return valorProdutos() + FRETE; }

function valorCupomSelecionado() {
  if (!state.cupomSelecionado) return 0;
  const c = state.cupons.find(c => c.id === state.cupomSelecionado);
  return c ? Number(c.valor) : 0;
}

// Pagamento automatico: o restante apos o cupom e dividido em partes
// iguais entre os cartoes marcados, com a ultima parte absorvendo o
// arredondamento, para a soma bater exatamente com o total.
function calcularValoresPorCartao() {
  const restante = Math.max(0, Math.round((valorTotalCompra() - valorCupomSelecionado()) * 100) / 100);
  const ids = [...state.cartoesSelecionados];
  if (ids.length === 0 || restante === 0) return {};
  const parte = Math.floor((restante / ids.length) * 100) / 100;
  const valores = {};
  let somaParcial = 0;
  ids.forEach((id, i) => {
    if (i === ids.length - 1) {
      valores[id] = Math.round((restante - somaParcial) * 100) / 100;
    } else {
      valores[id] = parte;
      somaParcial += parte;
    }
  });
  return valores;
}

function somaCartoesSelecionados() {
  return Object.values(calcularValoresPorCartao()).reduce((s, v) => s + v, 0);
}

function viewCheckout() {
  const enderecos = state.cliente.enderecos || [];
  const cartoes = state.cliente.cartoes || [];
  const valoresPorCartao = calcularValoresPorCartao();
  const pago = somaCartoesSelecionados() + valorCupomSelecionado();
  const falta = Math.max(0, Math.round((valorTotalCompra() - pago) * 100) / 100);
  const coberto = falta === 0 && (state.cartoesSelecionados.size > 0 || state.cupomSelecionado);

  return `
    <div class="row">
      <div class="col" style="flex:1.4">
        <div class="card">
          <h2><span class="num">2</span>Endereço de Entrega</h2>
          ${enderecos.map(e => `
            <label class="select-card ${state.enderecoSelecionado === e.id ? 'selected' : ''}" data-cy="radio-endereco-card">
              <input type="radio" name="endereco" value="${e.id}" data-cy="radio-endereco"
                ${state.enderecoSelecionado === e.id ? 'checked' : ''}
                onchange="state.enderecoSelecionado=${e.id}; render();">
              <div class="titulo">${esc(e.apelido)}</div>
              <div class="detalhe">${esc(e.tipoLogradouro)} ${esc(e.logradouro)}, ${esc(e.numero)} — ${esc(e.bairro)}, ${esc(e.cidade)}/${esc(e.estado)}</div>
            </label>
          `).join('') || '<div class="empty">Nenhum endereço cadastrado.</div>'}

          ${state.mostrarNovoEndereco ? formNovoEndereco() : `
            <button class="secondary" data-cy="btn-novo-endereco" onclick="state.mostrarNovoEndereco=true; render();">+ Cadastrar novo endereço</button>
          `}
        </div>

        <div class="card">
          <h2><span class="num">3</span>Forma de Pagamento</h2>
          <h3 class="sublabel">Cartões de crédito</h3>
          ${cartoes.map(c => `
            <label class="select-card ${state.cartoesSelecionados.has(c.id) ? 'selected' : ''}" data-cy="pagamento-cartao-row" data-id="${c.id}">
              <input type="checkbox" data-cy="chk-cartao" ${state.cartoesSelecionados.has(c.id) ? 'checked' : ''}
                onchange="toggleCartao(${c.id}, this.checked)">
              <div class="titulo">${esc(c.bandeira)} •••• ${esc(c.ultimosQuatroDigitos)}</div>
              <div class="detalhe">${esc(c.titular)}
                ${state.cartoesSelecionados.has(c.id) ? `<span class="badge auto" data-cy="valor-auto-cartao">cobra ${fmt(valoresPorCartao[c.id] || 0)}</span>` : ''}
              </div>
            </label>
          `).join('') || '<div class="empty">Nenhum cartão cadastrado.</div>'}
          ${state.mostrarNovoCartao ? formNovoCartao() : `
            <button class="secondary" data-cy="btn-novo-cartao" onclick="state.mostrarNovoCartao=true; render();">+ Cadastrar novo cartão</button>
          `}

          <h3 class="sublabel">Cupom de desconto <span style="font-weight:400; text-transform:none; letter-spacing:0;">(escolha no máximo um)</span></h3>
          ${state.cupons.map(c => `
            <label class="select-card cupom ${state.cupomSelecionado === c.id ? 'selected' : ''}" data-cy="cupom-row" data-id="${c.id}">
              <input type="radio" name="cupom" data-cy="radio-cupom" value="${c.id}"
                ${state.cupomSelecionado === c.id ? 'checked' : ''}
                onchange="selecionarCupom(${c.id})">
              <span class="valor">${fmt(c.valor)}</span>
              <div class="titulo"><span data-cy="cupom-codigo">${esc(c.codigo)}</span> <span class="badge ${c.tipo}">${c.tipo}</span></div>
            </label>
          `).join('') || '<div class="empty">Nenhum cupom disponível.</div>'}
          ${state.cupomSelecionado ? `<button class="link" style="margin-top:6px;" data-cy="btn-remover-cupom" onclick="selecionarCupom(null)">Remover cupom</button>` : ''}
        </div>
      </div>

      <div class="col" style="flex:1; position:sticky; top:84px;">
        <div class="card">
          <h2>Resumo da Compra</h2>
          <div class="total-line"><span>Produtos</span><span class="v">${fmt(valorProdutos())}</span></div>
          <div class="total-line"><span>Frete</span><span class="v" data-cy="frete-valor">${fmt(FRETE)}</span></div>
          ${state.cupomSelecionado ? `<div class="total-line"><span>Cupom</span><span class="v" style="color:var(--ok);" data-cy="cupom-desconto">− ${fmt(valorCupomSelecionado())}</span></div>` : ''}
          <div class="total-line grand"><span>Total</span><span class="v" data-cy="total-compra">${fmt(valorTotalCompra())}</span></div>
          <div class="total-line falta ${coberto ? 'coberto' : ''}">
            <span>${coberto ? 'Pagamento completo' : 'Ainda falta cobrir'}</span>
            <span class="v" data-cy="valor-restante">${fmt(falta)}</span>
          </div>
          <button class="action" style="width:100%; margin-top:16px;" data-cy="btn-finalizar-compra" onclick="finalizarCompra()">
            Confirmar Pagamento
          </button>
          <button class="secondary" style="width:100%; margin-top:8px;" data-cy="btn-voltar-carrinho" onclick="state.view='carrinho'; render();">← Voltar ao carrinho</button>
        </div>
      </div>
    </div>
  `;
}

function formNovoEndereco() {
  return `
    <div class="card" style="background:var(--panel-2); margin-top:12px; padding:16px;">
      <h3 class="sublabel">Novo Endereço</h3>
      <label>Apelido *</label><input id="ne-apelido" data-cy="i-ne-apelido">
      <label>Tipo de residência *</label><input id="ne-tipores" data-cy="i-ne-tipores" placeholder="Casa">
      <label>Tipo de logradouro *</label><input id="ne-tipolog" data-cy="i-ne-tipolog" placeholder="Rua">
      <label>Logradouro *</label><input id="ne-logradouro" data-cy="i-ne-logradouro">
      <label>Número *</label><input id="ne-numero" data-cy="i-ne-numero">
      <label>Bairro *</label><input id="ne-bairro" data-cy="i-ne-bairro">
      <label>CEP *</label><input id="ne-cep" data-cy="i-ne-cep">
      <label>Cidade *</label><input id="ne-cidade" data-cy="i-ne-cidade">
      <label>Estado *</label><input id="ne-estado" data-cy="i-ne-estado">
      <label>País *</label><input id="ne-pais" data-cy="i-ne-pais" value="Brasil">
      <label style="display:flex; align-items:center; gap:6px; margin-top:12px;">
        <input type="checkbox" id="ne-cobranca" checked> Usar como cobrança
      </label>
      <label style="display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="ne-entrega" checked> Usar como entrega
      </label>
      <button class="action" style="margin-top:14px;" data-cy="btn-salvar-endereco" onclick="salvarNovoEndereco()">Salvar Endereço</button>
      <button class="secondary" style="margin-top:14px;" onclick="state.mostrarNovoEndereco=false; render();">Cancelar</button>
    </div>
  `;
}

// RN0025 - bandeira de lista fechada. Os valores sao os do enum Bandeira do
// backend (AMERICAN_EXPRESS, e nao AMEX).
function formNovoCartao() {
  return `
    <div class="card" style="background:var(--panel-2); margin-top:12px; padding:16px;">
      <h3 class="sublabel">Novo Cartão</h3>
      <label>Número *</label><input id="nc-numero" data-cy="i-nc-numero" placeholder="Somente dígitos">
      <label>Bandeira *</label>
      <select id="nc-bandeira" data-cy="i-nc-bandeira">
        <option value="VISA">VISA</option><option value="MASTERCARD">MASTERCARD</option>
        <option value="ELO">ELO</option><option value="AMERICAN_EXPRESS">AMERICAN EXPRESS</option>
        <option value="HIPERCARD">HIPERCARD</option>
      </select>
      <label>Nome impresso *</label><input id="nc-titular" data-cy="i-nc-titular">
      <label>Código de segurança *</label><input id="nc-cvv" data-cy="i-nc-cvv" maxlength="4">
      <button class="action" style="margin-top:14px;" data-cy="btn-salvar-cartao" onclick="salvarNovoCartao()">Salvar Cartão</button>
      <button class="secondary" style="margin-top:14px;" onclick="state.mostrarNovoCartao=false; render();">Cancelar</button>
    </div>
  `;
}

function toggleCartao(cartaoId, marcado) {
  if (marcado) state.cartoesSelecionados.add(cartaoId);
  else state.cartoesSelecionados.delete(cartaoId);
  render();
}

// RN0033 - apenas um cupom por compra: selecionar um desmarca qualquer
// outro automaticamente (por isso e um radio, nao checkbox).
function selecionarCupom(cupomId) {
  state.cupomSelecionado = cupomId;
  render();
}

// RF0035/RN0023 - novo endereço durante a compra, incorporado ao perfil.
async function salvarNovoEndereco() {
  esconderErro();
  const g = id => document.getElementById(id).value;
  try {
    const novo = await api(`/clientes/${CLIENTE_ID}/enderecos`, {
      method: 'POST',
      body: JSON.stringify({
        apelido: g('ne-apelido'), tipoResidencia: g('ne-tipores'), tipoLogradouro: g('ne-tipolog'),
        logradouro: g('ne-logradouro'), numero: g('ne-numero'), bairro: g('ne-bairro'), cep: g('ne-cep'),
        cidade: g('ne-cidade'), estado: g('ne-estado'), pais: g('ne-pais'),
        cobranca: document.getElementById('ne-cobranca').checked,
        entrega: document.getElementById('ne-entrega').checked,
      }),
    });
    state.cliente = await api(`/clientes/${CLIENTE_ID}`);
    state.enderecoSelecionado = novo.id;
    state.mostrarNovoEndereco = false;
    await render();
  } catch (e) { mostrarErro(e.message); }
}

// RF0036/RN0024/RN0025 - novo cartão durante a compra, incorporado ao perfil.
async function salvarNovoCartao() {
  esconderErro();
  const g = id => document.getElementById(id).value;
  try {
    const novo = await api(`/clientes/${CLIENTE_ID}/cartoes`, {
      method: 'POST',
      body: JSON.stringify({
        numero: g('nc-numero'), bandeira: g('nc-bandeira'), titular: g('nc-titular'), cvv: g('nc-cvv'),
      }),
    });
    state.cliente = await api(`/clientes/${CLIENTE_ID}`);
    state.cartoesSelecionados.add(novo.id);
    state.mostrarNovoCartao = false;
    await render();
  } catch (e) { mostrarErro(e.message); }
}

// RF0038 - finaliza a compra. Os valores por cartão sao calculados
// automaticamente (ver calcularValoresPorCartao) - o cliente so escolhe
// QUAIS cartoes usar, nao quanto cobrar em cada um.
async function finalizarCompra() {
  esconderErro();
  if (!state.enderecoSelecionado) return mostrarErro('Selecione um endereço de entrega.');

  const valoresPorCartao = calcularValoresPorCartao();
  const cartoes = Object.entries(valoresPorCartao).map(([cartaoId, valor]) => ({ cartaoId: Number(cartaoId), valor }));
  const cupomIds = state.cupomSelecionado ? [state.cupomSelecionado] : [];

  try {
    const pedido = await api(`/clientes/${CLIENTE_ID}/pedidos`, {
      method: 'POST',
      body: JSON.stringify({ enderecoId: state.enderecoSelecionado, cartoes, cupomIds }),
    });
    state.pedidoFinalizado = pedido;
    state.view = 'confirmacao';
    state.cartoesSelecionados = new Set();
    state.cupomSelecionado = null;
    state.enderecoSelecionado = null;
    setCarrinho({ itens: [], total: 0, itensExpirados: [], podeComprar: false });
    await render();
  } catch (e) {
    mostrarErro(e.message);
    // RN0032/RN0044/RNF0042 - o servidor pode ter ajustado o carrinho (quantidade
    // reduzida, item removido, item expirado). Recarrega e, se mudou, volta ao
    // carrinho para o cliente ver o resultado, com o alerta ainda na tela.
    try {
      const antes = JSON.stringify((state.carrinho.itens || []).map(i => [i.id, i.quantidade]));
      await carregarTudo();
      const depois = JSON.stringify((state.carrinho.itens || []).map(i => [i.id, i.quantidade]));
      if (antes !== depois || (state.carrinho.itensExpirados || []).length) {
        state.view = 'carrinho';
        await render();
        mostrarErro(e.message);
      }
    } catch (_) { /* o alerta original ja esta na tela */ }
  }
}

// ========================================================================
// VIEW: CONFIRMAÇÃO
// ========================================================================
function viewConfirmacao() {
  const p = state.pedidoFinalizado;
  const sufixo = new URLSearchParams(window.location.search).get('clienteId');
  const linkPedidos = 'pedidos.html' + (sufixo ? `?clienteId=${encodeURIComponent(sufixo)}` : '');
  return `
    <div class="card confirmacao">
      <div class="check">✓</div>
      <h2>Pedido realizado com sucesso!</h2>
      <div class="pedido-num">Pedido <strong data-cy="pedido-id">#${p.id}</strong></div>
      <div class="status-pill" data-cy="pedido-status" data-status="${p.status}">${statusTexto(p.status)}</div>
      <div class="valor-final" data-cy="pedido-total">${fmt(p.valorTotal)}</div>
      <div class="resumo-pedido">
        ${(p.itens || []).map(i => `<div class="li"><span>${i.quantidade}× ${esc(i.produtoNome)}</span><span>${fmt(i.subtotal)}</span></div>`).join('')}
        <div class="li"><span>Frete</span><span>${fmt(p.frete)}</span></div>
        <div class="li"><span>Entrega</span><span>${esc(p.enderecoResumo || '')}</span></div>
      </div>
      <p class="muted small" style="margin-bottom:18px;" data-cy="aviso-pagamento">O pagamento será validado junto à operadora do cartão. Acompanhe o andamento em "Meus pedidos".</p>
      <button class="action" data-cy="btn-nova-compra" onclick="reiniciar()">Fazer nova compra</button>
      <button class="secondary" style="margin-left:8px;" data-cy="btn-ver-pedidos" onclick="window.location.href='${linkPedidos}'">Ver meus pedidos</button>
    </div>
  `;
}

async function reiniciar() {
  state.view = 'carrinho';
  state.pedidoFinalizado = null;
  await carregarTudo();
  await render();
}

// ---------------------------------------------------------------------
(async function start() {
  try {
    await carregarTudo();
    await render();
  } catch (e) {
    mostrarErro('Não foi possível carregar os dados da API (' + API_BASE + '). ' + e.message);
  }
})();
</script>
</body>
</html>
