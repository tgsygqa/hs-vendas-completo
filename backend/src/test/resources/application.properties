# Testes de integracao: H2 em memoria, sem job agendado interferindo.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.test-support.enabled=true
app.carrinho.bloqueio-minutos=30
app.carrinho.aviso-minutos=5
# intervalo longo: os testes chamam a varredura explicitamente
app.carrinho.varredura-segundos=3600
spring.h2.console.enabled=false
logging.level.root=WARN
logging.level.com.hardwarestore.OPERACOES_DE_ESCRITA=WARN
