# Perfil "postgres": usa o PostgreSQL em vez do H2.
# Ativar:  npm run start:back:postgres
#     ou:  mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# No Codespace, o .devcontainer instala o Postgres e cria este banco/usuario
# automaticamente (ver .devcontainer/post-create.sh). Em outra maquina, crie o
# banco e o usuario abaixo a mao, ou ajuste estas linhas.
spring.datasource.url=jdbc:postgresql://localhost:5432/hardwarestore
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=hardwarestore
spring.datasource.password=hardwarestore

# Os seeders (ProdutoSeeder/DataSeeder/CupomSeeder) NAO sao idempotentes: o CPF
# do Joao Silva e unico. Por isso o esquema e recriado (e os dados de
# demonstracao recarregados) a cada subida do backend, igual ao H2.
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=false

# O reset de dados dos testes usa TRUNCATE; mantenha desligado em base que
# voce nao queira apagar.
app.test-support.enabled=false
