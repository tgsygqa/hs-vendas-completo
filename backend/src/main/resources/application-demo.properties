# Perfil "demo": prazos CURTOS de bloqueio do carrinho, para mostrar ao vivo
# (RN0044/RN0045/RNF0042) sem esperar 30 minutos.
#   npm run start:back:demo
#
# Itens bloqueados por 3 min; o aviso aparece quando faltam 2 min (ou seja, 1 min
# depois de incluir o item); o job de expiração roda a cada 10 s.
app.carrinho.bloqueio-minutos=3
app.carrinho.aviso-minutos=2
app.carrinho.varredura-segundos=10
