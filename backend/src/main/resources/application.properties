# === Servidor ===
server.port=8080

# === Banco de dados (PADRAO: H2 em memoria) ===
# Nao precisa instalar nada: o banco nasce a cada subida do backend ja com os
# dados de demonstracao (ProdutoSeeder, DataSeeder, CupomSeeder) e some quando
# o backend para. Isso tambem garante um estado inicial previsivel para os
# testes automatizados (Cypress).
#
# Para usar PostgreSQL no lugar, rode com o perfil "postgres":
#   npm run start:back:postgres
# (ver application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:hardwarestore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 para inspecionar as tabelas durante a demonstracao:
# http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:hardwarestore, usuario: sa, senha vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
# Deixe "true" para mostrar o SQL no terminal (fica bem verboso).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# === Jackson ===
spring.jackson.serialization.write-dates-as-timestamps=false

# === Regras de bloqueio de carrinho (RN0044 / RN0045 / RNF0042) ===
# Prazo (em minutos) que os itens ficam bloqueados para outros clientes,
# contado a partir do ULTIMO item incluido no carrinho.
app.carrinho.bloqueio-minutos=30
# O cliente e avisado quando faltar esta quantidade de minutos (RN0044).
app.carrinho.aviso-minutos=5
# De quanto em quanto tempo o job libera os itens expirados.
app.carrinho.varredura-segundos=30

# === Suporte a testes automatizados ===
# Habilita /api/test-support/** (reset da base, ajuste de estoque, etc.), usado
# SO pelos testes Cypress. Nunca habilite em ambiente real.
app.test-support.enabled=true
# RN0037/RN0038 - o sistema valida sozinho o pagamento das compras EM PROCESSAMENTO depois deste
# atraso (simula a resposta da operadora; negativo desliga). O job confere a cada N segundos.
app.pagamento.validacao-segundos=10
app.pagamento.varredura-segundos=2
