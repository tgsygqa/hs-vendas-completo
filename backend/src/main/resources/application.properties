# === Servidor ===
server.port=8080

# === Banco PostgreSQL ===
# No Codespace, o .devcontainer instala o Postgres localmente e cria este
# banco/usuario automaticamente (ver .devcontainer/post-create.sh). Para
# rodar fora do Codespace, crie o banco e o usuario abaixo a mao, ou ajuste
# estas 4 linhas para o seu Postgres local.
spring.datasource.url=jdbc:postgresql://localhost:5432/hardwarestore
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=hardwarestore
spring.datasource.password=hardwarestore

# === JPA / Hibernate ===
# O dialect do Postgres e detectado automaticamente a partir do driver
# (Spring Boot 3 / Hibernate 6), nao precisa declarar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === Jackson ===
spring.jackson.serialization.write-dates-as-timestamps=false
